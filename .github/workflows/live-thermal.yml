name: Live thermal — NASA FIRMS daily pull
# KFL-M 1.3 Part A. Pulls the VIIRS 375 m NRT regional files, matches detections to
# ledger sites and commits web/public/data/live/*.json. The Worker reads the
# committed file from this public repo (raw.githubusercontent.com), so no redeploy
# and no Cloudflare secret are needed for the daily refresh.
on:
  schedule:
    - cron: '30 6 * * *'   # 06:30 UTC: after the ~00:30–03:00 UTC night passes over Nigeria reach FIRMS NRT
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live-thermal
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pull FIRMS and update the live summary
        run: python3 scripts/live_thermal.py
      - name: Commit if changed
        run: |
          git config user.name 'kaliabe-live-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add web/public/data/live/
          if git diff --cached --quiet; then echo 'no change'; exit 0; fi
          git commit -m "live thermal: FIRMS snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep 5; done
          exit 1
