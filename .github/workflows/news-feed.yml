name: News cross-check — Nigeria gas-flare / energy feed
# KFL-M 1.7. Pulls keyless Google News RSS (en-NG) + outlet feeds, matches the
# headlines to ledger flare sites and commits web/public/data/news/feed.json.
# The Worker reads the committed file from this public repo (raw.githubusercontent.com),
# so no redeploy and no secret are needed for the refresh.
on:
  schedule:
    - cron: '15 7 * * *'   # 07:15 UTC, daily, after the thermal pull at 06:30
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: news-feed
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pull news and match to flare sites
        run: python3 scripts/news_feed.py
      - name: Commit if changed
        run: |
          git config user.name 'kaliabe-live-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add web/public/data/news/
          if git diff --cached --quiet; then echo 'no change'; exit 0; fi
          git commit -m "news cross-check: feed snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep 5; done
          exit 1